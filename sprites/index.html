<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPvsZ · 精灵图册</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101b19;color:#e4ede5}*{box-sizing:border-box}body{margin:0;padding:36px 24px 64px;max-width:1360px;margin-inline:auto}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{font:12px monospace;letter-spacing:3px;color:#98d7a2}h1{font-size:36px;margin:12px 0}p{font-size:14px;color:#a5b9ad;line-height:1.7;margin:4px 0}.pill{border:1px solid #385344;padding:8px 14px;border-radius:24px;color:#b8e7b9;white-space:nowrap;font:13px monospace}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px;background:#182722;border:1px solid #2b4437;border-radius:12px;margin-bottom:24px;position:sticky;top:8px;z-index:2}button,select{font:inherit;color:#dce9df;background:#233b2e;border:1px solid #46634e;border-radius:6px;padding:8px 13px;cursor:pointer}button:hover,button.active{background:#b6e5a1;color:#142519}label{font-size:13px;color:#a5b9ad}input{accent-color:#b6e5a1}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#182722;border:1px solid #2b4437;border-radius:10px;overflow:hidden}.stage{height:192px;display:grid;place-items:center;background-color:#284631;background-image:linear-gradient(45deg,#2c4c3520 25%,transparent 25%),linear-gradient(-45deg,#2c4c3520 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#36563c50 75%),linear-gradient(-45deg,transparent 75%,#36563c50 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{width:168px;height:168px;image-rendering:pixelated}.projectiles canvas{width:112px;height:112px}.meta{padding:14px 16px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:16px;margin:0}.id{font:11px monospace;color:#92ab99}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.controls select{font-size:12px;max-width:140px;padding:5px 8px}.frame{font:11px monospace;color:#91ad9b}.error{color:#ff9b9b}footer{font-size:12px;color:#829a89;line-height:1.8;margin-top:28px}@media(max-width:950px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){body{padding:24px 14px}header{display:block}h1{font-size:28px}.pill{display:inline-block;margin-top:12px}main{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:160px}canvas{width:144px;height:144px}.meta{padding:10px}.title{display:block}.id{display:block;margin-top:4px}.toolbar{padding:10px;gap:6px}button{font-size:12px;padding:8px}.controls{display:block}.frame{display:block;margin-top:6px}}
</style></head><body><header><div><div class="eyebrow">WPVSZ / SPRITE COLLECTION</div><h1>植物与僵尸 · 精灵图册</h1><p>透明像素素材，逐帧预览。选择状态，检查动作与倒地效果。</p></div><span class="pill">13 类素材 · 96 × 96 / 帧</span></header>
<div class="toolbar"><button id="play">暂停动画</button><button data-mode="default" class="active">待机 / 行走</button><button data-mode="attack">攻击</button><button data-mode="die">死亡</button><label>速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label>逐帧 <input id="scrub" type="range" min="0" max="7" value="0" aria-label="动画帧"></label><label><input id="frozen" type="checkbox"> 冰冻色调</label></div><main id="grid"></main><footer>图册和游戏共用动画时间表。可用速度选择和逐帧滑块检查触地、出手和倒地停顿；选择其他动作后再选死亡可重播。</footer><script type="module" src="./gallery.js"></script></body></html>
